<!DOCTYPE html>
<html>
<head>
  <title>PredifyChain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h2>PredifyChain</h2>
<button onclick="demoLogin()">Demo Login</button>

<div id="status">Loading...</div>
<div id="markets"></div>

<script>
const API = "https://predifychain-server-production.up.railway.app";

let token = localStorage.getItem("predify_token");
let markets = [];

async function init() {
  await loadMarkets();

  if (token) {
    document.getElementById("status").innerText = "Logged in (Demo)";
  } else {
    document.getElementById("status").innerText = "Guest";
  }
}

async function loadMarkets() {
  const res = await fetch(API + "/api/markets");
  const data = await res.json();

  markets = data.markets || [];

  renderMarkets();
}

function renderMarkets() {
  const el = document.getElementById("markets");

  if (!markets.length) {
    el.innerHTML = "No markets";
    return;
  }

  el.innerHTML = markets.map(m => `
    <div style="border:1px solid #ccc;padding:10px;margin:10px;">
      <b>${m.symbol}</b><br/>
      Price: ${m.open_price}<br/>
      Ends: ${m.expiry_time}
    </div>
  `).join("");
}

async function demoLogin() {
  const res = await fetch(API + "/api/auth/demo-login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: "{}"
  });

  const json = await res.json();

  localStorage.setItem("predify_token", json.token);

  alert("Logged in!");
  location.reload();
}

init();
</script>

</body>
</html>
