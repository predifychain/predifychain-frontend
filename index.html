<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PredifyChain</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  margin:0;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#1e293b;
}

.container{
  padding:20px;
}

.filters button{
  margin-right:10px;
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.active{
  background:#22c55e;
  color:black;
}

.card{
  background:#1e293b;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

.btn{
  padding:8px 12px;
  border:none;
  margin-top:10px;
  cursor:pointer;
  border-radius:6px;
}

.buy{ background:#16a34a; }
.sell{ background:#dc2626; }

.side{
  position:fixed;
  right:0;
  top:70px;
  width:300px;
  background:#1e293b;
  padding:15px;
  height:100%;
}
</style>
</head>

<body>

<div class="header">
  <div>PredifyChain 🔥</div>
  <div>
    <button onclick="demoLogin()">Demo Login</button>
  </div>
</div>

<div class="container">

<div>
  Balance: $<span id="balance">0</span> |
  Mode: <span id="mode">Guest</span>
</div>

<div class="filters">
  <button onclick="setDuration(3)">3 min</button>
  <button onclick="setDuration(5)">5 min</button>
  <button onclick="setDuration(15)">15 min</button>
</div>

<div id="markets">Loading...</div>

</div>

<div class="side">
  <h3 id="selTitle">Select Market</h3>
  <div id="selPrice"></div>
  <div id="selTime"></div>
</div>

<script>
const API = "https://predifychain-server-production.up.railway.app";

let allMarkets = [];
let duration = 3;
let selected = null;
let token = localStorage.getItem("predify_token");
let balance = 0;

async function init(){
  await loadMarkets();

  if(token){
    document.getElementById("mode").innerText = "Demo";
    balance = 50000;
    document.getElementById("balance").innerText = balance;
  }
}

async function loadMarkets(){
  const res = await fetch(API+"/api/markets");
  const data = await res.json();

  allMarkets = data.markets || [];

  render();
}

function setDuration(d){
  duration = d;
  render();
}

function render(){
  const list = allMarkets.filter(m=>m.duration_minutes===duration);

  const el = document.getElementById("markets");

  if(!list.length){
    el.innerHTML = "No markets";
    return;
  }

  el.innerHTML = list.map(m=>`
    <div class="card" onclick="selectMarket('${m.id}')">
      <b>${m.symbol}</b><br/>
      Price: ${m.open_price}<br/>
      Ends: ${formatTime(m.expiry_time)}<br/>

      <button class="btn buy" onclick="event.stopPropagation(); trade('${m.id}','YES')">BUY YES</button>
      <button class="btn sell" onclick="event.stopPropagation(); trade('${m.id}','NO')">SELL NO</button>
    </div>
  `).join("");
}

function selectMarket(id){
  selected = allMarkets.find(m=>m.id===id);

  document.getElementById("selTitle").innerText = selected.symbol;
  document.getElementById("selPrice").innerText = "Price: "+selected.open_price;
  document.getElementById("selTime").innerText = "Ends: "+formatTime(selected.expiry_time);
}

function formatTime(t){
  return new Date(t).toLocaleTimeString();
}

async function demoLogin(){
  const res = await fetch(API+"/api/auth/demo-login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:"{}"
  });

  const json = await res.json();

  localStorage.setItem("predify_token",json.token);

  alert("Logged in");
  location.reload();
}

function trade(id,side){
  if(!token){
    alert("Login first");
    return;
  }

  const amount = 100;

  balance -= amount;
  document.getElementById("balance").innerText = balance;

  alert(side+" trade placed ($100)");
}

init();
</script>

</body>
</html>
